<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#DFD3C3"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#1A1A1A" stroke-width="6"/>
  
  <g transform="translate(100, 50)">
    <!-- Hood -->
    <path d="M150 70 Q200 10 250 70 Q200 40 150 70 Z" fill="#2E2E2E" stroke="#1A1A1A" stroke-width="6"/>
    <!-- Body & Sleeves -->
    <path d="M130 70 L270 70 L390 150 L340 230 L280 180 L280 440 L120 440 L120 180 L60 230 L10 150 Z" 
          fill="#2B2B2B" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
    <!-- Kangaroo pocket -->
    <path d="M140 320 L260 320 L280 410 L120 410 Z" fill="#1F1F1F" stroke="#1A1A1A" stroke-width="5"/>
    
    <!-- Thorn Screenprint Graphics on Sleeves -->
    <path d="M40 170 L25 190 M50 200 L30 220 M350 170 L365 190 M340 200 L360 220" stroke="#85586F" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Chest Embroidered Typography -->
    <text x="200" y="180" font-family="'Archivo Black', sans-serif" font-size="28" fill="#85586F" text-anchor="middle">THORN</text>
    <text x="200" y="210" font-family="monospace" font-size="12" fill="#D0B8A8" text-anchor="middle" letter-spacing="4">HEAVYWEIGHT 450GSM</text>
  </g>
  
  <!-- Neo Brutalist Tag -->
  <rect x="50" y="490" width="160" height="40" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <text x="130" y="516" font-family="monospace" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">450 GSM FRENCH TERRY</text>
</svg>
