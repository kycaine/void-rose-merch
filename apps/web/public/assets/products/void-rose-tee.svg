<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#D0B8A8"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#1A1A1A" stroke-width="6"/>
  <!-- Distressed background accents -->
  <line x1="40" y1="560" x2="560" y2="40" stroke="#DFD3C3" stroke-width="8" stroke-dasharray="16 16"/>
  
  <!-- T-Shirt Graphic -->
  <g transform="translate(100, 60)">
    <!-- T-shirt silhouette -->
    <path d="M120 40 L160 20 L240 20 L280 40 L380 90 L340 160 L290 140 L290 420 L110 420 L110 140 L60 160 L20 90 Z" 
          fill="#1A1A1A" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
    <!-- Collar cutout -->
    <path d="M160 20 C180 50 220 50 240 20 Z" fill="#D0B8A8" stroke="#1A1A1A" stroke-width="4"/>
    
    <!-- Rose Graphic on Chest -->
    <g transform="translate(150, 160)">
      <!-- Stem and thorns -->
      <path d="M50 140 Q40 80 50 20" stroke="#85586F" stroke-width="8" fill="none"/>
      <path d="M45 100 L30 90 M52 70 L68 60 M46 40 L32 30" stroke="#85586F" stroke-width="6" stroke-linecap="round"/>
      <!-- Rose Petals -->
      <circle cx="50" cy="20" r="30" fill="#85586F" stroke="#DFD3C3" stroke-width="4"/>
      <path d="M35 15 C45 0 55 0 65 15 C55 35 45 35 35 15 Z" fill="#DFD3C3"/>
      <path d="M40 25 C50 15 60 25 50 35 Z" fill="#85586F"/>
      <!-- Text print below rose -->
      <text x="50" y="170" font-family="monospace" font-size="14" font-weight="bold" fill="#F8EDE3" text-anchor="middle" letter-spacing="3">VOID / ROSE</text>
    </g>
  </g>
  
  <!-- Graphic border stamp -->
  <rect x="360" y="490" width="180" height="45" fill="#85586F" stroke="#1A1A1A" stroke-width="3"/>
  <text x="450" y="520" font-family="'Archivo Black', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">OFFICIAL FW26</text>
</svg>
