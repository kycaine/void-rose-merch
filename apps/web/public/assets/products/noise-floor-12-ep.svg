<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#DFD3C3"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#1A1A1A" stroke-width="6"/>
  
  <!-- Red Marble Vinyl -->
  <g transform="translate(300, 270)">
    <circle cx="0" cy="0" r="180" fill="#8B1E2E" stroke="#1A1A1A" stroke-width="6"/>
    <!-- Marble swirl effects -->
    <path d="M-120 -80 Q0 -160 120 -80 Q-20 60 -120 -80" fill="#B32B3E" opacity="0.6"/>
    <path d="M-80 120 Q60 150 120 40 Q0 0 -80 120" fill="#58111C" opacity="0.7"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#1A1A1A" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1A1A1A" stroke-width="1.5" opacity="0.5"/>
    <!-- Label -->
    <circle cx="0" cy="0" r="60" fill="#1A1A1A" stroke="#DFD3C3" stroke-width="4"/>
    <text x="0" y="-10" font-family="'Archivo Black', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">NOISE FLOOR</text>
    <text x="0" y="15" font-family="monospace" font-size="10" fill="#DFD3C3" text-anchor="middle">LIVE 12" EP</text>
  </g>
  
  <!-- Big SOLD OUT Diagonal Stamp -->
  <g transform="translate(300, 300) rotate(-18)">
    <rect x="-180" y="-45" width="360" height="90" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="6"/>
    <text x="0" y="18" font-family="'Archivo Black', sans-serif" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SOLD OUT</text>
  </g>
</svg>
