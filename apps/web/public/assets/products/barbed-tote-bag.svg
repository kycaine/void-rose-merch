<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#D0B8A8"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#1A1A1A" stroke-width="6"/>
  
  <g transform="translate(150, 70)">
    <!-- Tote Handles -->
    <path d="M70 120 L70 30 C70 0 130 0 130 30 L130 120" fill="none" stroke="#1A1A1A" stroke-width="14" stroke-linecap="square"/>
    <path d="M170 120 L170 30 C170 0 230 0 230 30 L230 120" fill="none" stroke="#1A1A1A" stroke-width="14" stroke-linecap="square"/>
    
    <!-- Tote Bag Body -->
    <rect x="30" y="120" width="240" height="280" fill="#F8EDE3" stroke="#1A1A1A" stroke-width="8"/>
    
    <!-- Barbed Wire Graphic -->
    <path d="M40 230 L260 230" stroke="#1A1A1A" stroke-width="6"/>
    <g transform="translate(80, 230)">
      <line x1="-15" y1="-15" x2="15" y2="15" stroke="#85586F" stroke-width="6"/>
      <line x1="-15" y1="15" x2="15" y2="-15" stroke="#85586F" stroke-width="6"/>
    </g>
    <g transform="translate(150, 230)">
      <line x1="-15" y1="-15" x2="15" y2="15" stroke="#85586F" stroke-width="6"/>
      <line x1="-15" y1="15" x2="15" y2="-15" stroke="#85586F" stroke-width="6"/>
    </g>
    <g transform="translate(220, 230)">
      <line x1="-15" y1="-15" x2="15" y2="15" stroke="#85586F" stroke-width="6"/>
      <line x1="-15" y1="15" x2="15" y2="-15" stroke="#85586F" stroke-width="6"/>
    </g>
    
    <text x="150" y="320" font-family="'Archivo Black', sans-serif" font-size="20" fill="#1A1A1A" text-anchor="middle">VOID/ROSE</text>
    <text x="150" y="345" font-family="monospace" font-size="11" fill="#85586F" font-weight="bold" text-anchor="middle" letter-spacing="2">16OZ HEAVY CANVAS</text>
  </g>
  
  <rect x="360" y="470" width="160" height="40" fill="#85586F" stroke="#1A1A1A" stroke-width="3"/>
  <text x="440" y="496" font-family="'Archivo Black', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">REINFORCED</text>
</svg>
