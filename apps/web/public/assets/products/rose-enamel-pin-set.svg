<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#D0B8A8"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#1A1A1A" stroke-width="6"/>
  
  <!-- Backing Card -->
  <rect x="100" y="80" width="400" height="440" fill="#F8EDE3" stroke="#1A1A1A" stroke-width="6"/>
  <text x="300" y="140" font-family="'Archivo Black', sans-serif" font-size="28" fill="#1A1A1A" text-anchor="middle">VOID/ROSE</text>
  <text x="300" y="165" font-family="monospace" font-size="12" fill="#85586F" text-anchor="middle" font-weight="bold" letter-spacing="3">ENAMEL PIN COLLECTION</text>
  
  <!-- Pin 1: Rose -->
  <g transform="translate(200, 260)">
    <circle cx="0" cy="0" r="45" fill="#85586F" stroke="#1A1A1A" stroke-width="5"/>
    <path d="M-20 -15 C0 -35 20 -15 0 20 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="10" fill="#1A1A1A"/>
  </g>
  
  <!-- Pin 2: Barbed Heart -->
  <g transform="translate(400, 260)">
    <path d="M0 25 C-35 -10 -40 -40 -15 -45 C5 -45 0 -20 0 -20 C0 -20 -5 -45 15 -45 C40 -40 35 -10 0 25 Z" 
          fill="#DFD3C3" stroke="#1A1A1A" stroke-width="5"/>
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#85586F" stroke-width="5"/>
  </g>
  
  <!-- Pin 3: Band Logo Banner -->
  <g transform="translate(300, 410)">
    <rect x="-120" y="-25" width="240" height="50" fill="#1A1A1A" stroke="#85586F" stroke-width="4"/>
    <text x="0" y="9" font-family="'Archivo Black', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">WEAR THE NOISE</text>
  </g>
</svg>
